name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Chromium into bundled_browsers/
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/bundled_browsers
        run: |
          python -m playwright install chromium
          Write-Host "Bundled browsers contents:"
          Get-ChildItem bundled_browsers -Recurse -Depth 2 | Select-Object FullName | Format-Table -AutoSize

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v',''
          } else {
            $v = "0.0.0-dev"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: PyInstaller build
        run: pyinstaller --noconfirm starping.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarPing-Setup-${{ steps.version.outputs.version }}
          path: dist/StarPing-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StarPing-Setup.exe
          draft: true
          generate_release_notes: true
